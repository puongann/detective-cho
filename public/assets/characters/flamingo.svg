<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"><style>.ch{animation:breathe 3.4s ease-in-out infinite;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:50% 100%}.m-happy,.m-love{animation-name:hop;animation-duration:2.8s}.m-shock{animation-name:shiver;animation-duration:2.4s}.m-angry{animation-name:puff;animation-duration:1.3s}.m-sad,.m-cry{animation-name:droop;animation-duration:4s}.m-sleep{animation-name:snore;animation-duration:3.8s}.m-sly,.m-sweat,.m-grumpy{animation-name:shifty;animation-duration:2.4s}@keyframes breathe{50%{transform:scale(1.015,.985)}}@keyframes hop{0%,58%,100%{transform:none}68%{transform:translateY(-16px) scale(.98,1.03)}78%{transform:scale(1.035,.965)}86%{transform:none}}@keyframes shiver{0%,30%,100%{transform:none}4%{transform:translateX(-7px) rotate(-1.5deg)}8%{transform:translateX(7px) rotate(1.5deg)}12%{transform:translateX(-6px)}16%{transform:translateX(6px)}20%{transform:translateX(-3px)}}@keyframes puff{50%{transform:scale(1.045,.965) translateY(2px)}}@keyframes droop{50%{transform:scale(1.01,.97) rotate(-1.2deg)}}@keyframes snore{50%{transform:scale(1.035,.965)}}@keyframes shifty{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}.blink{animation:blink 4.6s infinite;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:50% 50%}@keyframes blink{0%,91%,100%{transform:none}94%{transform:scaleY(.1)}}.drip{animation:drip 1.8s ease-in infinite;animation-delay:var(--d,0s)}.drip+.drip{animation-delay:calc(var(--d,0s) - .9s)}@keyframes drip{0%{transform:translateY(-8px);opacity:0}25%{opacity:1}100%{transform:translateY(34px);opacity:0}}.zz{animation:zz 3s ease-in-out infinite}@keyframes zz{0%{transform:translate(0,14px);opacity:0}30%{opacity:1}100%{transform:translate(24px,-34px);opacity:0}}.twinkle{animation:tw 1.8s ease-in-out infinite;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:50% 50%}@keyframes tw{0%,100%{transform:scale(.7) rotate(0);opacity:.75}50%{transform:scale(1.18) rotate(45deg);opacity:1}}.sway{animation:sway 3.4s ease-in-out infinite;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-14px)}}.beat{animation:beat 1.3s ease-in-out infinite;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:50% 50%}@keyframes beat{0%,60%,100%{transform:scale(1)}12%{transform:scale(1.16)}24%{transform:scale(.96)}36%{transform:scale(1.08)}}.tail{animation:wag 1.7s ease-in-out infinite;transform-origin:60px -40px}@keyframes wag{50%{transform:rotate(10deg)}}.paw{animation:paw 1s ease-in-out infinite;transform-origin:56px -112px}@keyframes paw{50%{transform:rotate(-18deg)}}.float{animation:float 3.2s ease-in-out infinite;animation-delay:var(--d,0s)}@keyframes float{50%{transform:translateY(-18px)}}.ripple{animation:ripple 2.8s ease-in-out infinite;animation-delay:var(--d,0s)}@keyframes ripple{50%{transform:translateX(26px);opacity:.3}}.flutter{animation:flutter 2.4s ease-in-out infinite;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:50% 0}@keyframes flutter{50%{transform:rotate(9deg)}}.glow{animation:glow 2.6s ease-in-out infinite}@keyframes glow{50%{opacity:.35}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="400" height="400" rx="40" fill="#f3e4c4"/><g transform="translate(250 500) scale(1.1 1.1)"><g class="ch ch-flamingo m-happy" style="--d:-0.35s">
